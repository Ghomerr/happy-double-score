# Publie la feuille de score sur GitHub Pages à chaque push sur main.
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Préparation du site
        run: |
          mkdir _site
          cp -r index.html app.css app.js sw.js manifest.webmanifest regles.pdf assets icons _site/

      - name: Configuration de Pages
        uses: actions/configure-pages@v5

      - name: Envoi du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
